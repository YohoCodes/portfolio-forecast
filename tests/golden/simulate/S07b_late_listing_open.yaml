# Golden S07b: a symbol with no open at the fill is dropped, the rest are
# renormalized, and a warning names it (open fill).
#
# Rule: as S07a, but the fill is Mon's open, so a symbol is dropped when it
#   has no Mon open.
#
# Setup: A, B and C, daily bars, open fill. br0 = 90,000.
#   Weights {A: 1, B: 1, C: 2}. B has no Mon bar. Without B: A = 1 / 3,
#   C = 2 / 3.
#
# Derivation: q_A = 30,000 / 96 = 312.5; q_C = 60,000 / 40 = 1,500.
#   Mon 09:30  buy at O                                      V = 90,000
#   Mon 16:00  312.5 x 100 + 1,500 x 40 = 31,250 + 60,000    V = 91,250
#   Tue 16:00  312.5 x 120 + 1,500 x 42 = 37,500 + 63,000    V = 100,500
#   Wed 16:00  312.5 x  90 + 1,500 x 44 = 28,125 + 66,000    V = 94,125
#   Thu 16:00  312.5 x  99 + 1,500 x 40 = 30,937.5 + 60,000  V = 90,937.5
case: S07b
title: A symbol with no first open is dropped and named (open fill)
fields: [Open, Close]
bars_tz: null
bars:  # [date, open, close]
  A:
    - ["2026-03-02", 96, 100]
    - ["2026-03-03", 101, 120]
    - ["2026-03-04", 118, 90]
    - ["2026-03-05", 92, 99]
  B:
    - ["2026-03-02", null, null]
    - ["2026-03-03", 19, 20]
    - ["2026-03-04", 24, 25]
    - ["2026-03-05", 29, 30]
  C:
    - ["2026-03-02", 40, 40]
    - ["2026-03-03", 41, 42]
    - ["2026-03-04", 43, 44]
    - ["2026-03-05", 45, 40]
weights: {A: 1, B: 1, C: 2}
br0: 90000
fill: open
interval: 1 day
expected:
  label_tz: America/New_York
  values:
    - ["2026-03-02 09:30", 90000]
    - ["2026-03-02 16:00", 91250]
    - ["2026-03-03 16:00", 100500]
    - ["2026-03-04 16:00", 94125]
    - ["2026-03-05 16:00", 90937.5]
  fill_prices: {A: 96, C: 40}
  shares: {A: 312.5, C: 1500}
  warnings:
    - "Dropped 1 symbol(s) with no open on the first bar: B"
