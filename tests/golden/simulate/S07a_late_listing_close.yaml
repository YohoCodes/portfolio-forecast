# Golden S07a: a symbol with no price at the fill is dropped, the rest are
# renormalized, and a warning names it (close fill).
#
# Rule: a symbol that can't be bought at the fill (e.g. it listed later) is
#   dropped from the whole backtest, and the remaining weights are scaled to
#   sum to 1. The warning names the symbol, how many returns it is missing
#   and the date of its first price.
#
# Setup: A, B and C, daily bars, close fill. br0 = 90,000.
#   Weights {A: 1, B: 1, C: 2}. B's first price is Tue, so it has no Mon
#   close to buy at, and its Mon -> Tue return (1 of 3) is missing.
#   Without B: A = 1 / 3, C = 2 / 3.
#
# Derivation: q_A = 30,000 / 100 = 300; q_C = 60,000 / 40 = 1,500.
#   Mon  buy at C: 300 x 100 + 1,500 x 40                V = 90,000
#   Tue  300 x 120 + 1,500 x 42 = 36,000 + 63,000        V = 99,000
#   Wed  300 x  90 + 1,500 x 44 = 27,000 + 66,000        V = 93,000
#   Thu  300 x  99 + 1,500 x 40 = 29,700 + 60,000        V = 89,700
case: S07a
title: A symbol with no first price is dropped and named (close fill)
fields: [Close]
bars_tz: null
bars:  # [date, close]
  A:
    - ["2026-03-02", 100]
    - ["2026-03-03", 120]
    - ["2026-03-04", 90]
    - ["2026-03-05", 99]
  B:
    - ["2026-03-02", null]
    - ["2026-03-03", 20]
    - ["2026-03-04", 25]
    - ["2026-03-05", 30]
  C:
    - ["2026-03-02", 40]
    - ["2026-03-03", 42]
    - ["2026-03-04", 44]
    - ["2026-03-05", 40]
weights: {A: 1, B: 1, C: 2}
br0: 90000
fill: close
interval: 1 day
expected:
  label_tz: null
  values:
    - ["2026-03-02", 90000]
    - ["2026-03-03", 99000]
    - ["2026-03-04", 93000]
    - ["2026-03-05", 89700]
  fill_prices: {A: 100, C: 40}
  shares: {A: 300, C: 1500}
  warnings:
    - "Dropped 1 symbol(s) with missing prices: B (1 of 3 returns missing, first price 2026-03-03)"
