# U3, B2, B1.1: continuous-mode backtest (calendar=None) with
# fill="close", across 00:00 UTC on a weekend. One class, no gaps or open
# marks; each value labelled at its bar's close.
#
# Derivation
# 1. calendar=None: grid t_k = t_0 + k Delta, Delta = 1 hour. Bars 2024-11-30
#    (Sat) 22:00, 23:00, 12-01 (Sun) 00:00, 01:00 UTC.
# 2. AAA only, br0 = 1000. O 99, 100, 102, 101; C 100, 102, 101, 103.
# 3. Fill (B2, "close"): br0 at the first bar's close, n = 1000/100 = 10.
# 4. Marks at each bar's close, t + 1 hour (B1.1): 23:00, 12-01 00:00, 01:00,
#    02:00; values 10 C: 1000, 1020, 1010, 1030. 00:00 is not an open mark.
# 5. Classes: every return regular (U3). No missing grid point: no warning.
rule: [U3, B2, B1.1]
kind: simulate_buy_and_hold
inputs:
  calendar: null
  bars: ["2024-11-30T22:00:00+00:00", "2024-11-30T23:00:00+00:00",
         "2024-12-01T00:00:00+00:00", "2024-12-01T01:00:00+00:00"]
  bars_tz: UTC
  prices:
    Open:
      AAA: [99.0, 100.0, 102.0, 101.0]
    Close:
      AAA: [100.0, 102.0, 101.0, 103.0]
  w: {AAA: 1.0}
  br0: 1000
  fill: close
expected:
  labels: ["2024-11-30T23:00:00+00:00", "2024-12-01T00:00:00+00:00",
           "2024-12-01T01:00:00+00:00", "2024-12-01T02:00:00+00:00"]
  tz: UTC
  values: [1000.0, 1020.0, 1010.0, 1030.0]
  classes: [regular, regular, regular]
  warns: []
tolerance: {abs: 1.0e-9}  # values; labels and classes exact
