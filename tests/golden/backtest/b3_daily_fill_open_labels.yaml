# B3, B2: daily bars with fill="open": one initial open mark, then each
# session's close, on the exchange clock.
#
# Derivation
# 1. Input: daily bars (naive dates) 2024-11-26, 2024-11-27, 2024-11-29;
#    Thanksgiving 11-28 is closed, so these are consecutive XNYS sessions.
#    One symbol, A, held.
# 2. B2: daily bars have one initial open mark, then close to close. B3: the
#    open fill is labelled at the open of the first bar's session, each value at
#    its session's close.
#    - fill: 11-26 09:30 EST
#    - closes: 11-26 16:00, 11-27 16:00, 11-29 13:00 (half-day)
#    4 marks, 3 returns.
# 3. A fresh everywhere (own open at the fill, own close at each close).
# 4. Classes: daily and longer data have one class, all "regular" in the
#    BacktestResult (U1).
rule: [B3, B2]
kind: history_marks
inputs:
  bars: ["2024-11-26", "2024-11-27", "2024-11-29"]
  opens:
    A: [100.0, 101.0, 102.0]
  closes:
    A: [101.0, 102.0, 103.0]
  held: {A: true}
  fill: open
expected:
  labels: ["2024-11-26T09:30:00-05:00", "2024-11-26T16:00:00-05:00",
           "2024-11-27T16:00:00-05:00", "2024-11-29T13:00:00-05:00"]
  tz: America/New_York
  fresh:
    A: [true, true, true, true]
  classes: [regular, regular, regular]
tolerance: 0  # labels, flags and classes, compared exactly
