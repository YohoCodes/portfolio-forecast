# U3, MC2, MC8: daily continuous history; future marks t_T + k days,
# through the weekend and the US holiday alike (no calendar).
#
# Derivation
# 1. calendar=None. History labels 00:00 UTC on 2024-11-26, 11-27, 11-28
#    (Thanksgiving, irrelevant here): Delta = 1 day, t_T = 11-28 00:00.
# 2. n = 4 bars: 11-29, 11-30 (Sat), 12-01 (Sun), 12-02, all 00:00 UTC.
# 3. All regular, tau 1.
rule: [U3, MC2, MC8]
kind: next_trading_dates
inputs:
  calendar: null
  labels: ["2024-11-26T00:00:00+00:00", "2024-11-27T00:00:00+00:00", "2024-11-28T00:00:00+00:00"]
  labels_tz: UTC
  values: [100.0, 101.0, 102.0]
  n: 4
expected:
  labels: ["2024-11-29T00:00:00+00:00", "2024-11-30T00:00:00+00:00",
           "2024-12-01T00:00:00+00:00", "2024-12-02T00:00:00+00:00"]
  classes: [regular, regular, regular, regular]
  tau: [1.0, 1.0, 1.0, 1.0]
tolerance: {abs: 1.0e-12}  # tau; labels and classes exact
