# U3: classify_returns in continuous mode. One class, regular, with no gaps
# or open marks; the return spanning a missing grid point is irregular.
#
# Derivation
# 1. calendar=None: grid t_k = t_0 + k Delta. Labels 2024-11-30 (a Saturday)
#    20:00, 21:00, 22:00, then 2024-12-01 00:00, 01:00, 02:00, 03:00 UTC: steps
#    of 1 hour except one of 2 hours, so Delta = 1 hour; the grid point 23:00
#    is missing. 7 marks, 6 returns. Midnight is not a session boundary here.
# 2. Classes (U3: every return regular, a missing grid point makes the return
#    spanning it irregular):
#    - ending 21:00, 22:00: regular
#    - ending 12-01 00:00: span 22:00-00:00 contains 23:00: irregular
#    - ending 01:00, 02:00, 03:00: regular (00:00 is not an open mark: no gap)
rule: [U3, MC1]
kind: classify_returns
inputs:
  calendar: null
  labels: ["2024-11-30T20:00:00+00:00", "2024-11-30T21:00:00+00:00", "2024-11-30T22:00:00+00:00",
           "2024-12-01T00:00:00+00:00", "2024-12-01T01:00:00+00:00", "2024-12-01T02:00:00+00:00",
           "2024-12-01T03:00:00+00:00"]
  labels_tz: UTC
  values: [100.0, 101.0, 102.0, 103.0, 104.0, 105.0, 106.0]
expected:
  labels: ["2024-11-30T21:00:00+00:00", "2024-11-30T22:00:00+00:00", "2024-12-01T00:00:00+00:00",
           "2024-12-01T01:00:00+00:00", "2024-12-01T02:00:00+00:00", "2024-12-01T03:00:00+00:00"]
  classes: [regular, regular, irregular, regular, regular, regular]
tolerance: 0  # labels and classes, compared exactly
