# U3, B2: continuous-mode backtest with fill="open". br0 sits at the
# first bar's open, labelled at its start (B2, B3: "the fill at the open it
# fills"); the first return, open to close, is regular like every other (U3).
#
# Derivation
# 1. calendar=None, Delta = 1 hour. Bars 2024-11-30 22:00, 23:00, 12-01 00:00,
#    01:00 UTC.
# 2. AAA only, br0 = 1000. O 100, 101, 102, 101; C 101, 102, 101, 103.
# 3. Fill at the first open, 100: n = 10, labelled 11-30 22:00.
# 4. Then each bar's close: 23:00, 00:00, 01:00, 02:00; values 1010, 1020,
#    1010, 1030. Later opens enter no mark (no open marks in continuous mode).
# 5. Classes: regular x 4. No warning.
rule: [U3, B2]
kind: simulate_buy_and_hold
inputs:
  calendar: null
  bars: ["2024-11-30T22:00:00+00:00", "2024-11-30T23:00:00+00:00",
         "2024-12-01T00:00:00+00:00", "2024-12-01T01:00:00+00:00"]
  bars_tz: UTC
  prices:
    Open:
      AAA: [100.0, 101.0, 102.0, 101.0]
    Close:
      AAA: [101.0, 102.0, 101.0, 103.0]
  w: {AAA: 1.0}
  br0: 1000
  fill: open
expected:
  labels: ["2024-11-30T22:00:00+00:00", "2024-11-30T23:00:00+00:00", "2024-12-01T00:00:00+00:00",
           "2024-12-01T01:00:00+00:00", "2024-12-01T02:00:00+00:00"]
  tz: UTC
  values: [1000.0, 1010.0, 1020.0, 1010.0, 1030.0]
  classes: [regular, regular, regular, regular]
  warns: []
tolerance: {abs: 1.0e-9}  # values; labels and classes exact
