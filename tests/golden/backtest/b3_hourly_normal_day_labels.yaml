# B3: hourly bar labels on a normal full day, 2024-12-03 (Tuesday).
#
# Derivation
# 1. XNYS session on 2024-12-03: 09:30-16:00 America/New_York, EST (UTC-05:00).
# 2. Input bars start on a :30 hourly grid: 09:30, 10:30, ..., 14:30 (six bars;
#    the history stops before the 15:30 bar, which has its own case).
# 3. B3: each value is labelled at its bar's close, start + 1 hour, all of
#    which are before 16:00, so no bar is cut short:
#    09:30 -> 10:30, 10:30 -> 11:30, 11:30 -> 12:30, 12:30 -> 13:30,
#    13:30 -> 14:30, 14:30 -> 15:30.
# 4. Note the first bar is labelled 10:30, not 10:00: the grid is learned from
#    the bars, not assumed to be on the hour.
rule: [B3]
kind: close_times
inputs:
  index: ["2024-12-03T09:30:00-05:00", "2024-12-03T10:30:00-05:00", "2024-12-03T11:30:00-05:00",
          "2024-12-03T12:30:00-05:00", "2024-12-03T13:30:00-05:00", "2024-12-03T14:30:00-05:00"]
  index_tz: America/New_York
expected:
  labels: ["2024-12-03T10:30:00-05:00", "2024-12-03T11:30:00-05:00", "2024-12-03T12:30:00-05:00",
           "2024-12-03T13:30:00-05:00", "2024-12-03T14:30:00-05:00", "2024-12-03T15:30:00-05:00"]
  tz: America/New_York
tolerance: 0  # labels only, compared exactly
