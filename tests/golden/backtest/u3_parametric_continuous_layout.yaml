# U3, MC2, MC4, MC8: parametric_monte_carlo in continuous mode: one
# class, future marks t_T + k Delta, sim_length in bars.
#
# History (generated, test_golden.generated_history, seed 51): 201 hourly
# marks, 2024-12-06 00:00 UTC (Friday) to 12-14 08:00 UTC (Saturday), 24/7;
# l ~ N(0.0001, 0.003^2), 200 regular returns.
#
# Derivation
# 1. calendar=None: one pool of 200 regular returns (>= 30), fitted with the
#    normal (distribution fixed).
# 2. Layout: t_T + k h, k = 1..5: 12-14 09:00 ... 13:00 UTC, regular; no
#    session structure on a Saturday. Paths 3 x 6, column 0 = 1.0, fit filled.
rule: [U3, MC2, MC4, MC8]
kind: parametric_monte_carlo
inputs:
  generate:
    kind: continuous
    start: "2024-12-06T00:00:00+00:00"
    bars: 200
    grid: 1h
    seed: 51
    regular: {mean: 0.0001, sd: 0.003}
  calendar: null
  sim_length: 5
  n_sims: 3
  random_state: 7
  options: {distribution: norm}
expected:
  shape: [3, 6]
  labels: ["2024-12-14T09:00:00+00:00", "2024-12-14T10:00:00+00:00", "2024-12-14T11:00:00+00:00",
           "2024-12-14T12:00:00+00:00", "2024-12-14T13:00:00+00:00"]
  classes: [regular, regular, regular, regular, regular]
  fit_none: false
tolerance: 0  # labels, classes and shape only
