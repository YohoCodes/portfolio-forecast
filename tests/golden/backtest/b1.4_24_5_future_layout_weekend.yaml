# B1.4, MC2, MC8: the future layout on "24/5" across a weekend. The
# first future session (Monday) opens with a gap mark; the next one (Tuesday)
# has none, since its open is Monday's close.
#
# Derivation
# 1. Calendar "24/5": sessions 00:00-24:00 UTC each weekday. Fri 2024-11-29
#    closes at 11-30 00:00; the next sessions are Mon 12-02 (00:00 to 12-03
#    00:00) and Tue 12-03 (00:00 to 12-04 00:00). O_Mon is after C_Fri; O_Tue =
#    C_Mon.
# 2. History: hourly marks Fri 20:00, 21:00, 22:00, 23:00, Sat 11-30 00:00 (UTC).
#    Delta = 1 hour. The last mark is C_Fri, a session close, so the history
#    does not end mid-session (no MC2 remainder).
# 3. n = 2 sessions (MC2: on intraday history n counts sessions): Mon and Tue.
#    - Mon: open mark at 12-02 00:00, class gap, tau 1 (a gap is one unit, U2);
#      then bar closes 01:00, 02:00, ..., 12-03 00:00 (24 bars), regular, tau 1
#    - Tue: O_Tue = C_Mon = 12-03 00:00, already a mark, so no open mark and no
#      gap (B1.4); bar closes 12-03 01:00 ... 12-04 00:00 (24 bars), regular,
#      tau 1
#    1 + 24 + 24 = 49 marks; the horizon ends at C_Tue = 12-04 00:00.
rule: [B1.4, MC2, MC8]
kind: next_trading_dates
inputs:
  calendar: "24/5"
  labels: ["2024-11-29T20:00:00+00:00", "2024-11-29T21:00:00+00:00", "2024-11-29T22:00:00+00:00", "2024-11-29T23:00:00+00:00",
          "2024-11-30T00:00:00+00:00"]
  labels_tz: UTC
  values: [100.0, 101.0, 102.0, 103.0, 104.0]
  n: 2
expected:
