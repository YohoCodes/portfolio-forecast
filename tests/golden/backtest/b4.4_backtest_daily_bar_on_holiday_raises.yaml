# B4.4: the backtest raises on a daily bar dated on a non-session day.
#
# Derivation
# 1. Calendar: XNYS has no session on 2024-11-28 (Thanksgiving).
# 2. Daily bars (midnight dates) 11-26, 11-27, 11-28, 11-29; AAA weight 1.
# 3. B4.4: "Daily bars dated on a non-session day raise": ValueError.
rule: [B4.4]
kind: simulate_buy_and_hold
inputs:
  bars: ["2024-11-26", "2024-11-27", "2024-11-28", "2024-11-29"]
  prices:
    Open:
      AAA: [100.0, 101.0, 102.0, 103.0]
    Close:
      AAA: [101.0, 102.0, 103.0, 104.0]
  w: {AAA: 1.0}
  br0: 1000
  fill: close
expected:
  raises: ValueError
tolerance: 0  # no output; the call must raise
