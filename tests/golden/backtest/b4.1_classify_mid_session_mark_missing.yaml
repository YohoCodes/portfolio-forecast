# B4.1, MC1: classify_returns finds a scheduled mid-session mark missing
# from the labels; the return spanning it is irregular.
#
# Derivation
# 1. Calendar (XNYS, EST UTC-05:00): 2024-11-27 full session 09:30-16:00;
#    11-28 Thanksgiving; 2024-11-29 half-day 09:30-13:00.
# 2. Labels: 11-27 15:30, 16:00; 11-29 09:30, 10:30, 11:30, 13:00. Several
#    marks per session: intraday (MC1). Grid: hourly on :30 (Delta = 1 hour,
#    the modal step), so 11-29's scheduled marks are 09:30 (open), 10:30,
#    11:30, 12:30, 13:00 (short last bar at the early close). 12:30 is missing.
# 3. 6 marks, 5 returns, indexed by the mark each ends at:
#    - 11-27 16:00: bar close, regular
#    - 11-29 09:30: open mark at the session open after a holiday, nothing
#      scheduled in between: gap (MC1; this is the inferable open mark)
#    - 11-29 10:30, 11:30: regular
#    - 11-29 13:00: from 11:30, its span contains the scheduled 12:30 mark,
#      absent from the series: irregular (B4.1)
rule: [B4.1, MC1]
kind: classify_returns
inputs:
  labels: ["2024-11-27T15:30:00-05:00", "2024-11-27T16:00:00-05:00", "2024-11-29T09:30:00-05:00",
           "2024-11-29T10:30:00-05:00", "2024-11-29T11:30:00-05:00", "2024-11-29T13:00:00-05:00"]
  labels_tz: America/New_York
  values: [100.0, 101.0, 102.0, 103.0, 104.0, 105.0]
expected:
  labels: ["2024-11-27T16:00:00-05:00", "2024-11-29T09:30:00-05:00", "2024-11-29T10:30:00-05:00",
           "2024-11-29T11:30:00-05:00", "2024-11-29T13:00:00-05:00"]
  classes: [regular, gap, regular, regular, irregular]
tolerance: 0  # labels and classes, compared exactly
