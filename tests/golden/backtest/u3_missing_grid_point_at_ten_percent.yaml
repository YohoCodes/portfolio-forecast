# U3: continuous mode (calendar=None) on hourly 24/7 data with one
# grid point missing. Every return is regular except the one spanning the
# missing point, which is irregular. 1 of 10 returns irregular is exactly 10%,
# not more, so there is no warning.
#
# Derivation
# 1. calendar=None: grid t_k = t_0 + k Delta, Delta = 1 hour (the step between
#    almost every pair of bars); no sessions, no open marks, no gaps (U3).
# 2. Data, A held: hourly bars starting 2024-12-01 (a Sunday; nothing is
#    skipped in continuous mode) 00:00, 01:00, 02:00, 03:00, 04:00, then 06:00,
#    07:00, 08:00, 09:00, 10:00, 11:00 UTC. The 05:00 bar is missing. 11 bars.
# 3. Marks (B1.1: a bar's value is labelled at its close, here t + Delta;
#    B2, fill="close": br0 at the first bar's close): 01:00, 02:00, 03:00,
#    04:00, 05:00, then 07:00, 08:00, 09:00, 10:00, 11:00, 12:00 UTC. The grid
#    point 06:00 (the missing bar's close) has no mark. 11 marks, 10 returns.
# 4. Freshness: A has its own close at every mark: fresh everywhere.
# 5. Classes (U3): every return regular, except the one ending at 07:00, whose
#    span 05:00-07:00 contains the missing grid point 06:00: irregular.
# 6. Warning (U3): 1 irregular return out of 10 is 10%, not more than 10%:
#    no UserWarning.
rule: [U3]
kind: history_marks
inputs:
  calendar: null
  bars: ["2024-12-01T00:00:00+00:00", "2024-12-01T01:00:00+00:00", "2024-12-01T02:00:00+00:00",
         "2024-12-01T03:00:00+00:00", "2024-12-01T04:00:00+00:00", "2024-12-01T06:00:00+00:00",
         "2024-12-01T07:00:00+00:00", "2024-12-01T08:00:00+00:00", "2024-12-01T09:00:00+00:00",
         "2024-12-01T10:00:00+00:00", "2024-12-01T11:00:00+00:00"]
  bars_tz: UTC
  opens:
    A: [100.0, 101.0, 102.0, 103.0, 104.0, 106.0, 107.0, 108.0, 109.0, 110.0, 111.0]
  closes:
    A: [101.0, 102.0, 103.0, 104.0, 105.0, 107.0, 108.0, 109.0, 110.0, 111.0, 112.0]
  held: {A: true}
  fill: close
expected:
  labels: ["2024-12-01T01:00:00+00:00", "2024-12-01T02:00:00+00:00", "2024-12-01T03:00:00+00:00",
           "2024-12-01T04:00:00+00:00", "2024-12-01T05:00:00+00:00", "2024-12-01T07:00:00+00:00",
           "2024-12-01T08:00:00+00:00", "2024-12-01T09:00:00+00:00", "2024-12-01T10:00:00+00:00",
           "2024-12-01T11:00:00+00:00", "2024-12-01T12:00:00+00:00"]
  tz: UTC
  fresh:
    A: [true, true, true, true, true, true, true, true, true, true, true]
  classes: [regular, regular, regular, regular, irregular, regular, regular, regular, regular, regular]
  warns: []
tolerance: 0  # labels, flags and classes, compared exactly
