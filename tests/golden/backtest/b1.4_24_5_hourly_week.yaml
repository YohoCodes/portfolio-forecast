# B1.4: on the "24/5" calendar a weeknight has no gap. Wednesday's close
# is Thursday's open (both 00:00 UTC), so Thursday and Friday get no open mark
# and their first bars are close to close, regular; the only gap is Monday's,
# after the weekend, where the market was closed.
#
# Derivation
# 1. Calendar "24/5" (exchange_calendars, UTC): one session per weekday,
#    00:00 to 24:00 UTC, no holidays (11-28 is a session). Weekdays 2024-11-27
#    (Wed), 11-28 (Thu), 11-29 (Fri), 12-02 (Mon). So O_Thu = C_Wed =
#    11-28 00:00 and O_Fri = C_Thu = 11-29 00:00, while C_Fri = 11-30 00:00 is
#    before O_Mon = 12-02 00:00.
# 2. Data: hourly bars, A held, starting Wed 22:00 and running without a hole
#    to Fri 23:00 (50 bars: Wed 22:00, 23:00; Thu 00:00-23:00; Fri
#    00:00-23:00), then Mon 00:00 and 01:00 (2 bars). 52 bars.
# 3. Marks (B1.1, B2, B3, fill="close"; Delta = 1 hour, no short bars):
#    - fill: close of the Wed 22:00 bar, Wed 23:00
#    - then each bar's close through Fri: Thu 00:00 (= C_Wed), Thu 01:00, ...,
#      Fri 00:00 (= C_Thu), ..., Sat 00:00 (= C_Fri): 49 marks. Because
#      O_d = C_{d-1} on Thu and Fri, there is no separate open mark at
#      Thu 00:00 or Fri 00:00 (B1.4): one mark each, the previous close.
#    - Monday: O_Mon = 12-02 00:00 differs from C_Fri, so Monday has an open
#      mark at its first bar's start, 12-02 00:00 (B1.4), then the closes
#      01:00 and 02:00.
#    1 + 49 + 3 = 53 marks, 52 returns.
# 4. Freshness: A has its own close at every close mark and its own open at the
#    Monday open mark: fresh everywhere.
# 5. Classes (indexed by the mark each return ends at):
#    - Thu 00:00 ... Sat 00:00 (49 returns): bar closes, close to close,
#      regular, including Thu 01:00 and Fri 01:00, the first bars of their
#      sessions (B1.4: close to close, regular)
#    - Mon 00:00: from C_Fri to O_Mon, the market closed in between: gap
#      (the 50th return)
#    - Mon 01:00, 02:00: regular
#    So 49 x regular, 1 x gap, 2 x regular.
rule: [B1.4, B1.2, B1.3]
kind: history_marks
