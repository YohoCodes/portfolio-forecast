# B1.4, MC1: classify_returns on the "24/5" calendar. Weeknight
# session crossings are close to close (regular); only Monday's open mark,
# after the weekend, ends a gap. Labels are those of
# b1.4_24_5_hourly_week.yaml.
#
# Derivation
# 1. Calendar "24/5": sessions 00:00-24:00 UTC each weekday, so on weeknights
#    O_d = C_{d-1} (Thu 11-28 00:00, Fri 11-29 00:00), while C_Fri = 11-30 00:00
#    and O_Mon = 12-02 00:00 differ.
# 2. Labels: hourly from Wed 11-27 23:00 through Sat 11-30 00:00 (50 marks:
#    every hour, none missing), then Mon 12-02 00:00, 01:00, 02:00. 53 marks,
#    52 returns. Several marks per session: intraday (MC1).
# 3. Classes:
#    - every return ending Thu 00:00 ... Sat 00:00 (49): consecutive hourly
#      marks, no session closed in between: regular. A mark at 00:00 on a
#      weeknight is the previous session's close, not an open mark (B1.4).
#    - ending Mon 00:00: an open mark at the session open after the weekend
#      close: gap (MC1), the inferable open mark
#    - ending Mon 01:00, 02:00: regular
rule: [B1.4, MC1]
kind: classify_returns
