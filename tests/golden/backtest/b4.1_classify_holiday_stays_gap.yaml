# B4.1, MC1: classify_returns across a holiday. Nothing is scheduled on
# Thanksgiving, so the return to the next open mark stays a gap. Same shape as
# b4.1_classify_missing_session.yaml, one session later.
#
# Derivation
# 1. Calendar (XNYS, EST UTC-05:00): 2024-11-27 full session 09:30-16:00;
#    11-28 Thanksgiving, no session; 2024-11-29 half-day 09:30-13:00.
# 2. Labels: 11-27 15:30, 16:00; 11-29 09:30, 10:30, 11:30. Hourly grid on :30.
# 3. 5 marks, 4 returns:
#    - 11-27 16:00: regular
#    - 11-29 09:30: open mark at the session open, from the previous session's
#      close, no scheduled mark in between: gap
#    - 11-29 10:30, 11:30: regular
rule: [B4.1, MC1]
kind: classify_returns
inputs:
  labels: ["2024-11-27T15:30:00-05:00", "2024-11-27T16:00:00-05:00", "2024-11-29T09:30:00-05:00",
           "2024-11-29T10:30:00-05:00", "2024-11-29T11:30:00-05:00"]
  labels_tz: America/New_York
  values: [100.0, 101.0, 102.0, 103.0, 104.0]
expected:
  labels: ["2024-11-27T16:00:00-05:00", "2024-11-29T09:30:00-05:00",
           "2024-11-29T10:30:00-05:00", "2024-11-29T11:30:00-05:00"]
  classes: [regular, gap, regular, regular]
tolerance: 0  # labels and classes, compared exactly
