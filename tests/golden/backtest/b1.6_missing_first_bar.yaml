# B1.6: session 2's first bar is missing; its open mark is labelled at the
# first available bar's start, and the return ending there is irregular.
#
# Derivation
# 1. Calendar (XNYS, EST UTC-05:00): 2024-11-29 is a half-day, 09:30-13:00;
#    2024-12-02 (Monday) is a full session, 09:30-16:00. Bars start on a :30
#    hourly grid. One symbol, A, held.
# 2. Bars: 11-29 09:30, 10:30, 11:30, 12:30 (the 12:30 bar ends at the 13:00
#    close); 12-02 10:30, 11:30. The 12-02 09:30 bar is missing.
# 3. Marks (B1.1, B2, B3, fill="open"):
#    - fill at the open of the first bar: 11-29 09:30
#    - bar closes on 11-29: 10:30, 11:30, 12:30, 13:00 (half-day close)
#    - 12-02's open mark: its first available bar starts at 10:30, after the
#      09:30 session open, so (B1.6) the open mark is labelled 10:30
#    - bar closes on 12-02: 11:30 (10:30 bar), 12:30 (11:30 bar)
#    8 marks, 7 returns.
# 4. Freshness: A has its own open at both open marks and its own close at every
#    close mark, so A is fresh at all 8 marks.
# 5. Classes, indexed by the mark each return ends at:
#    - 11-29 10:30 ... 13:00: four bar returns, regular
#    - 12-02 10:30: from the 11-29 13:00 close to an open mark after the
#      session open: irregular (B1.6), not gap
#    - 12-02 11:30: open mark to the first available bar's close, regular
#    - 12-02 12:30: close to close, regular
rule: [B1.6, B1.1, B3]
kind: history_marks
inputs:
  bars: ["2024-11-29T09:30:00-05:00", "2024-11-29T10:30:00-05:00", "2024-11-29T11:30:00-05:00",
         "2024-11-29T12:30:00-05:00", "2024-12-02T10:30:00-05:00", "2024-12-02T11:30:00-05:00"]
  bars_tz: America/New_York
  opens:
    A: [100.0, 101.0, 102.0, 103.0, 105.0, 106.0]
  closes:
    A: [101.0, 102.0, 103.0, 104.0, 106.0, 107.0]
  held: {A: true}
  fill: open
expected:
  labels: ["2024-11-29T09:30:00-05:00", "2024-11-29T10:30:00-05:00", "2024-11-29T11:30:00-05:00",
           "2024-11-29T12:30:00-05:00", "2024-11-29T13:00:00-05:00",
           "2024-12-02T10:30:00-05:00", "2024-12-02T11:30:00-05:00", "2024-12-02T12:30:00-05:00"]
  tz: America/New_York
  fresh:
    A: [true, true, true, true, true, true, true, true]
  classes: [regular, regular, regular, regular, irregular, regular, regular]
tolerance: 0  # labels, flags and classes, compared exactly
