# B3: hourly labels across the 2024 spring-forward. US daylight saving time
# began Sunday 2024-03-10, so Friday 2024-03-08 is EST (UTC-05:00) and Monday
# 2024-03-11 is EDT (UTC-04:00). The input is in UTC, where the session moves
# an hour earlier between the two days; the labels must still fall on the
# exchange clock's grid.
#
# Derivation
# 1. Both sessions run 09:30-16:00 America/New_York; the bars start 09:30,
#    10:30, ..., 15:30 local time (seven bars a day).
# 2. In UTC: 2024-03-08 09:30 EST = 14:30Z, so bars start 14:30Z ... 20:30Z;
#    2024-03-11 09:30 EDT = 13:30Z, so bars start 13:30Z ... 19:30Z.
# 3. B3: each value at its bar's close on the exchange clock: 10:30, 11:30,
#    12:30, 13:30, 14:30, 15:30 local, and 16:00 for the short 15:30 bar.
# 4. Back in UTC (labels compared as instants; the expected list is written with
#    exchange-clock offsets):
#    - 2024-03-08: 15:30Z, 16:30Z, 17:30Z, 18:30Z, 19:30Z, 20:30Z, 21:00Z
#    - 2024-03-11: 14:30Z, 15:30Z, 16:30Z, 17:30Z, 18:30Z, 19:30Z, 20:00Z
#    A grid learned in UTC would be wrong on one of the two days.
rule: [B3]
kind: close_times
inputs:
  index: ["2024-03-08T14:30:00Z", "2024-03-08T15:30:00Z", "2024-03-08T16:30:00Z", "2024-03-08T17:30:00Z",
          "2024-03-08T18:30:00Z", "2024-03-08T19:30:00Z", "2024-03-08T20:30:00Z",
          "2024-03-11T13:30:00Z", "2024-03-11T14:30:00Z", "2024-03-11T15:30:00Z", "2024-03-11T16:30:00Z",
          "2024-03-11T17:30:00Z", "2024-03-11T18:30:00Z", "2024-03-11T19:30:00Z"]
  index_tz: UTC
expected:
  labels: ["2024-03-08T10:30:00-05:00", "2024-03-08T11:30:00-05:00", "2024-03-08T12:30:00-05:00",
           "2024-03-08T13:30:00-05:00", "2024-03-08T14:30:00-05:00", "2024-03-08T15:30:00-05:00",
           "2024-03-08T16:00:00-05:00",
           "2024-03-11T10:30:00-04:00", "2024-03-11T11:30:00-04:00", "2024-03-11T12:30:00-04:00",
           "2024-03-11T13:30:00-04:00", "2024-03-11T14:30:00-04:00", "2024-03-11T15:30:00-04:00",
           "2024-03-11T16:00:00-04:00"]
tolerance: 0  # labels only, compared exactly
