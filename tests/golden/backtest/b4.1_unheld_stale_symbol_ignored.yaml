# B4.1: staleness only matters for held symbols (w_i > 0). Same prices as
# b4.1_single_symbol_missing_open, but B is not held, so its missing open
# changes no class.
#
# Derivation
# 1. Calendar and bars as in b4.1_single_symbol_missing_open: 11-29 half-day
#    bars 09:30-12:30, 12-02 bars 09:30 and 10:30; B has no open on 12-02 09:30.
#    A is held, B is not.
# 2. Marks: 11-29 09:30 (fill), 10:30, 11:30, 12:30, 13:00; 12-02 09:30 (open
#    mark), 10:30, 11:30. 8 marks, 7 returns.
# 3. A is fresh at every mark (own open at open marks, own close at closes).
# 4. Classes: only A is held, and A is fresh at both ends of every return:
#    - 11-29 10:30 ... 13:00: regular
#    - 12-02 09:30: last close to an open mark at the session open: gap (B1.4)
#    - 12-02 10:30, 11:30: regular
# 5. Only A's freshness is checked; B's column is not part of this case.
rule: [B4.1, B1.4]
kind: history_marks
inputs:
  bars: ["2024-11-29T09:30:00-05:00", "2024-11-29T10:30:00-05:00", "2024-11-29T11:30:00-05:00",
         "2024-11-29T12:30:00-05:00", "2024-12-02T09:30:00-05:00", "2024-12-02T10:30:00-05:00"]
  bars_tz: America/New_York
  opens:
    A: [100.0, 101.0, 102.0, 103.0, 105.0, 106.0]
    B: [50.0, 50.5, 51.0, 51.5, null, 53.0]
  closes:
    A: [101.0, 102.0, 103.0, 104.0, 106.0, 107.0]
    B: [50.5, 51.0, 51.5, 52.0, 53.0, 53.5]
  held: {A: true, B: false}
  fill: open
expected:
  labels: ["2024-11-29T09:30:00-05:00", "2024-11-29T10:30:00-05:00", "2024-11-29T11:30:00-05:00",
           "2024-11-29T12:30:00-05:00", "2024-11-29T13:00:00-05:00",
           "2024-12-02T09:30:00-05:00", "2024-12-02T10:30:00-05:00", "2024-12-02T11:30:00-05:00"]
  tz: America/New_York
  fresh:
    A: [true, true, true, true, true, true, true, true]
  classes: [regular, regular, regular, regular, gap, regular, regular]
tolerance: 0  # labels, flags and classes, compared exactly
