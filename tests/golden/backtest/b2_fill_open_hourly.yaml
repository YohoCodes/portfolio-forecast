# B2, B1.2: fill="open" on hourly bars. br0 sits at the first bar's open,
# session 1 has no gap, and its first bar is a normal open-to-close bar.
#
# Derivation
# 1. Calendar (XNYS, EST UTC-05:00): 2024-11-29 half-day 09:30-13:00;
#    2024-12-02 (Mon) 09:30-16:00. Hourly bars on :30.
# 2. Bars: 11-29 09:30, 10:30, 11:30, 12:30 (short, to 13:00); 12-02 09:30.
#    Weights AAA 0.5, BBB 0.5; br0 = 1000.
#            11-29                       12-02
#    bar     09:30 10:30 11:30 12:30     09:30
#    AAA O   100   104   101   105       104
#    AAA C   104   101   105   106       108
#    BBB O    50    52    52    50        50
#    BBB C    52    52    50    51        53
# 3. Fill (B2, "open"): V(O_{1,1}) = br0 at the 09:30 open. n_AAA = 500/100 = 5,
#    n_BBB = 500/50 = 10. Labelled at the open it fills, 11-29 09:30 (B3).
# 4. Values, V = 5 P_AAA + 10 P_BBB:
#    - 11-29 09:30 (fill)       5*100 + 10*50 = 1000
#    - 11-29 10:30              5*104 + 10*52 = 1040
#    - 11-29 11:30              5*101 + 10*52 = 1025
#    - 11-29 12:30              5*105 + 10*50 = 1025
#    - 11-29 13:00              5*106 + 10*51 = 1040
#    - 12-02 09:30 (open mark)  5*104 + 10*50 = 1020
#    - 12-02 10:30              5*108 + 10*53 = 1070
# 5. Classes: 11-29 10:30 is session 1's first bar, open to close, regular
#    (B2: "session 1's first bar is a normal open-to-close bar"; no gap in
#    session 1); 11:30, 12:30, 13:00 regular; 12-02 09:30 gap; 10:30 regular.
rule: [B2, B1.2, B3]
kind: simulate_buy_and_hold
inputs:
  bars: ["2024-11-29T09:30:00-05:00", "2024-11-29T10:30:00-05:00", "2024-11-29T11:30:00-05:00",
         "2024-11-29T12:30:00-05:00", "2024-12-02T09:30:00-05:00"]
  bars_tz: America/New_York
  prices:
    Open:
      AAA: [100.0, 104.0, 101.0, 105.0, 104.0]
      BBB: [50.0, 52.0, 52.0, 50.0, 50.0]
    Close:
      AAA: [104.0, 101.0, 105.0, 106.0, 108.0]
      BBB: [52.0, 52.0, 50.0, 51.0, 53.0]
  w: {AAA: 0.5, BBB: 0.5}
  br0: 1000
  fill: open
expected:
  labels: ["2024-11-29T09:30:00-05:00", "2024-11-29T10:30:00-05:00", "2024-11-29T11:30:00-05:00",
           "2024-11-29T12:30:00-05:00", "2024-11-29T13:00:00-05:00",
           "2024-12-02T09:30:00-05:00", "2024-12-02T10:30:00-05:00"]
  tz: America/New_York
  values: [1000.0, 1040.0, 1025.0, 1025.0, 1040.0, 1020.0, 1070.0]
  classes: [regular, regular, regular, regular, gap, regular]
  warns: []
tolerance: {abs: 1.0e-9}  # values; labels and classes exact
