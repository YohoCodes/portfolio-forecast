# B4.4: post-market bars on a session day are dropped before marks are
# built, with one warning giving the count; the next return is still the gap
# from the regular close.
#
# Derivation
# 1. Calendar (XNYS, EST UTC-05:00): 2024-11-27 full session 09:30-16:00;
#    11-28 Thanksgiving; 2024-11-29 half-day 09:30-13:00. Hourly bars on :30.
# 2. Data, A held: 11-27 bars 13:30, 14:30, 15:30 (short, to 16:00), then
#    16:30, 17:30 (post-market: each starts after the 16:00 close, outside
#    [O_d, C_d]); 11-29 bars 09:30, 10:30.
# 3. B4.4: the two post-market bars are dropped; one UserWarning with the
#    count, 2.
# 4. Marks (fill="close"): 11-27 14:30 (fill), 15:30, 16:00 (session close, the
#    short last bar's close); 11-29 09:30 (open mark), 10:30, 11:30. 6 marks.
#    No mark at 17:30 or 18:30.
# 5. Freshness: fresh everywhere.
# 6. Classes: 11-27 15:30, 16:00 regular; 11-29 09:30 gap (from the 16:00
#    regular close, not from a post-market close); 10:30, 11:30 regular.
rule: [B4.4, B1.4]
kind: history_marks
inputs:
  bars: ["2024-11-27T13:30:00-05:00", "2024-11-27T14:30:00-05:00", "2024-11-27T15:30:00-05:00",
         "2024-11-27T16:30:00-05:00", "2024-11-27T17:30:00-05:00",
         "2024-11-29T09:30:00-05:00", "2024-11-29T10:30:00-05:00"]
  bars_tz: America/New_York
  opens:
    A: [100.0, 101.0, 102.0, 103.0, 104.0, 105.0, 106.0]
  closes:
    A: [101.0, 102.0, 103.0, 104.0, 105.0, 106.0, 107.0]
  held: {A: true}
  fill: close
expected:
  labels: ["2024-11-27T14:30:00-05:00", "2024-11-27T15:30:00-05:00", "2024-11-27T16:00:00-05:00",
           "2024-11-29T09:30:00-05:00", "2024-11-29T10:30:00-05:00", "2024-11-29T11:30:00-05:00"]
  tz: America/New_York
  fresh:
    A: [true, true, true, true, true, true]
  classes: [regular, regular, gap, regular, regular]
  warns:
    - {match: "outside|session|extended|dropp", count: 2}
tolerance: 0  # labels, flags and classes, compared exactly
