# M7, M1, M4, M6: statistical_report on a hand-built daily SimulationResult
# with one path that never falls: its Sortino is +inf, so the Sortino mean
# across paths is NaN, while the median and range use an inf-safe percentile;
# one warning, in the exact wording, gives the count and share of such paths.
# Per path, every figure follows performance_report's rules.
#
# SimulationResult (built by hand, fit None): three daily paths from the
# 2024-12-02 close (column 0 = 1.0) to the XNYS closes of 12-03, 12-04, 12-05
# (EST UTC-05:00), all regular.
#   P1: 1, 1.01, 1.0302, 1.040502     R = [0.01, 0.02, 0.01]
#   P2: 1, 1.02, 0.9996, 1.019592     R = [0.02, -0.02, 0.02]
#   P3: 1, 0.98, 0.9898, 0.979902     R = [-0.02, 0.01, -0.01]
#
# Derivation (r_f = 0; sd with ddof 1 as performance_report)
# 1. M1, M2: daily, starting at a close, so every R is a full session and
#    kept (as fill="close" daily). Annualized with 252.
# 2. Total Return = V_T - 1: 0.040502, 0.019592, -0.020098.
# 3. M4 session clock: N = 3 sessions after the first mark, Y = 3/252
#    (Total Years); CAGR = V_T^84 - 1:
#    P1 1.040502^84 - 1 = 27.0805250182; P2 4.1029253386; P3 -0.8183053657.
# 4. Volatility, Sharpe:
#    P1 mean 0.04/3, sd sqrt(1/30000) = 0.0057735027: vol 0.0916515139,
#       Sharpe 36.6606055596 (as m7_no_down_session_infinite).
#    P2 mean 0.02/3, sd sqrt(0.0010667/2) = 0.0230940108: vol 0.3666060556,
#       Sharpe sqrt(21) = 4.5825756950.
#    P3 mean -0.02/3, sd sqrt(0.00046667/2) = 0.0152752523: vol 0.2424871131,
#       Sharpe -sqrt(48) = -6.9282032303.
# 5. M7, DD over all n = 3 sessions:
#    P1 no e_d < 0: DD = 0, mean > 0: Sortino +inf, Downside Volatility 0.
#    P2 DD = sqrt(0.02^2/3) = 0.0115470054: Downside Volatility 0.1833030278,
#       Sortino (0.02/3) sqrt(252)/DD = sqrt(84) = 9.1651513899.
#    P3 DD = sqrt((0.02^2 + 0.01^2)/3) = 0.0129099445: Downside Volatility
#       0.2049390153, Sortino -sqrt(67.2) = -8.1975606128.
# 6. M6 over every mark, column 0 included: P1 0 (never falls); P2
#    1 - 0.9996/1.02 = 0.02; P3 1 - 0.979902/1 = 0.020098.
# 7. Sortino summary over [inf, 9.1651513899, -8.1975606128] (sorted
#    -8.1976, 9.1652, inf), percentiles by linear interpolation between order
#    statistics at h = (n - 1) p (0.3.0's method):
#    Median (h = 1) 9.1651513899; Lower (p = 0.025, h = 0.05)
#    -8.1975606128 + 0.05 (9.1651513899 + 8.1975606128) = -7.3294250126;
#    Upper (h = 1.95) between 9.17 and +inf: +inf (inf-safe: not NaN).
#    Mean: NaN. M7 makes the Sortino mean across paths NaN as soon as any
#    path is +inf (here P1), rather than the +inf an arithmetic mean would
#    give; the median and range above are order statistics and stay.
# 8. Warning (M7): exactly one, in the fixed wording, with k = 1 infinite
#    path of N = 3 and p = 1/3 = 0.3333..., printed to one decimal as a
#    percentage, 33.3%:
#    "Sortino ratio is infinite on 1 of 3 paths (33.3%); its mean is NaN".
#    The per-path warning is not repeated for P1 and there is no other
#    warning (no path is ruined).
# Tolerance: relative 1e-9.
rule: [M7, M1, M4, M6]
kind: statistical_report
inputs:
  simulation:
    paths: [[1.0, 1.01, 1.0302, 1.040502],
            [1.0, 1.02, 0.9996, 1.019592],
            [1.0, 0.98, 0.9898, 0.979902]]
    dates: ["2024-12-03T16:00:00-05:00", "2024-12-04T16:00:00-05:00", "2024-12-05T16:00:00-05:00"]
    dates_tz: America/New_York
    classes: [regular, regular, regular]
expected:
  per_path:
    Total Return: [0.040502, 0.019592, -0.020098]
    CAGR: [27.080525018176772, 4.102925338577315, -0.8183053657252066]
    Annualized Volatility: [0.0916515138991169, 0.3666060555964676, 0.24248711305964304]
    Sharpe Ratio: [36.66060555964672, 4.58257569495584, -6.928203230275509]
    Downside Volatility: [0.0, 0.1833030277982338, 0.20493901531919217]
    Sortino Ratio: [.inf, 9.16515138991168, -8.197560612767678]
    Max Drawdown: [0.0, 0.02, 0.020098]
  summary:
    Sortino Ratio: {Mean: .nan, Median: 9.16515138991168, Lower: -7.32942501263371, Upper: .inf}
  report:
    Total Years: 0.011904761904761904
  warns:
    - {match: '^(?-i:Sortino ratio is infinite on 1 of 3 paths \(33\.3%\); its mean is NaN)\Z'}
tolerance: {abs: 1.0e-12, rel: 1.0e-9}
