# M10, M1, M2: calculate_session_returns on Book I gives R_d, the exact series
# behind volatility, Sharpe and Sortino: full sessions only, at each session's
# close.
#
# Derivation
# 1. Book I of m1_intraday_three_session_report.yaml (fill="open"): session
#    closes 11-29 13:00 100, 12-02 16:00 102, 12-03 16:00 100.98; first mark
#    11-29 09:30 100.
# 2. R_1 (09:30 fill to the 11-29 close) is partial: excluded (M2).
#    R_2 = 102/100 - 1 = 0.02 (= (1 + g_2) prod_k (1 + r_{2,k}) - 1 with
#    g_2 = 95/100 - 1, the bar returns telescoping to 102/95);
#    R_3 = 100.98/102 - 1 = -0.01.
rule: [M10, M1, M2]
kind: calculate_session_returns
inputs:
  labels: ["2024-11-29T09:30:00-05:00", "2024-11-29T10:30:00-05:00", "2024-11-29T11:30:00-05:00",
           "2024-11-29T12:30:00-05:00", "2024-11-29T13:00:00-05:00",
           "2024-12-02T09:30:00-05:00", "2024-12-02T10:30:00-05:00", "2024-12-02T11:30:00-05:00",
           "2024-12-02T12:30:00-05:00", "2024-12-02T13:30:00-05:00", "2024-12-02T14:30:00-05:00",
           "2024-12-02T15:30:00-05:00", "2024-12-02T16:00:00-05:00",
           "2024-12-03T09:30:00-05:00", "2024-12-03T10:30:00-05:00", "2024-12-03T11:30:00-05:00",
           "2024-12-03T12:30:00-05:00", "2024-12-03T13:30:00-05:00", "2024-12-03T14:30:00-05:00",
           "2024-12-03T15:30:00-05:00", "2024-12-03T16:00:00-05:00"]
  labels_tz: America/New_York
  values: [100.0, 101.0, 101.0, 101.0, 100.0,
           95.0, 98.0, 98.0, 98.0, 98.0, 98.0, 98.0, 102.0,
           103.0, 103.0, 103.0, 103.0, 103.0, 103.0, 103.0, 100.98]
expected:
  labels: ["2024-12-02T16:00:00-05:00", "2024-12-03T16:00:00-05:00"]
  values: [0.02, -0.01]
tolerance: {abs: 1.0e-12, rel: 1.0e-9}
