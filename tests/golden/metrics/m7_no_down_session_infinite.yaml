# M7: no session below target (DD = 0) with a positive mean excess: Sortino is
# +inf, Downside Volatility 0, and one warning, in the exact wording, gives
# n = 3 sessions.
#
# Derivation
# 1. Daily values at XNYS closes (EST UTC-05:00), fill="close" layout:
#    2024-12-02 16:00 100, 12-03 101, 12-04 103.02, 12-05 104.0502.
# 2. R = [0.01, 0.02, 0.01] (all kept: daily fill="close", M2); r_f = 0, so
#    e = R, ebar = 0.04/3 = 0.0133333333. No e_d < 0: DD = 0.
# 3. M7: DD = 0 and ebar > 0: Sortino = +inf; Downside Volatility
#    = DD sqrt(252) = 0. Exactly one warning, one line, in M7's wording with
#    n = 3 (the sessions the downside deviation runs over, all of them):
#    "Sortino ratio is infinite: none of the 3 sessions is below the
#    risk-free rate".
# 4. Volatility and Sharpe stay finite: sd = sqrt(((-1/300)^2 + (2/300)^2
#    + (-1/300)^2)/2) = sqrt(1/30000) = 0.0057735027; Annualized Volatility
#    = 0.0057735027 sqrt(252) = 0.0916515139; Sharpe = 0.0133333333/0.0057735027
#    x sqrt(252) = 36.6606055596.
rule: [M7]
kind: performance_report
inputs:
  labels: ["2024-12-02T16:00:00-05:00", "2024-12-03T16:00:00-05:00",
           "2024-12-04T16:00:00-05:00", "2024-12-05T16:00:00-05:00"]
  labels_tz: America/New_York
  values: [100.0, 101.0, 103.02, 104.0502]
expected:
  report:
    Sortino Ratio: .inf
    Downside Volatility: 0.0
    Annualized Volatility: 0.09165151389911681
    Sharpe Ratio: 36.66060555964672
  warns:
    - {match: '^(?-i:Sortino ratio is infinite: none of the 3 sessions is below the risk-free rate)\Z'}
tolerance: {abs: 1.0e-12, rel: 1.0e-9}
