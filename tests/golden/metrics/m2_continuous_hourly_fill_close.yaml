# M2, U3: continuous hourly data starting exactly at 00:00 UTC.
# The first UTC day is excluded from the risk figures under both fills
# (whole under fill="open", partial under fill="close"), so the figures match the fill="open" twin case.
#
# Derivation
# 1. calendar=None, Delta = 1 hour. fill="close" output: the first bar's close,
#    2024-12-01 01:00 UTC, then each hourly close to 12-04 00:00 (72 marks).
#    Values: 100 every hour of 12-01 except 23:00 (101); 102 every hour of
#    12-02 from 00:00 except 23:00 (103); 104.04 every hour of 12-03 from
#    00:00 except 23:00 (105); 12-04 00:00 102.9996.
# 2. Boundaries 00:00 UTC on 12-02, 12-03, 12-04; D_t is the mark at the
#    boundary itself (at or before), not the 23:00 mark: 102, 104.04,
#    102.9996.
#    The first day runs from 12-01 01:00, partial, and is excluded.
# 3. M2: hourly bars, so the first UTC day is excluded under either fill.
#    Risk series R = [104.04/102 - 1, 102.9996/104.04 - 1] = [0.02, -0.01],
#    labelled at 12-03 00:00 and 12-04 00:00 UTC.
# 4. mean 0.005, sd = 0.015 sqrt(2) = 0.0212132034 (r_f = 0):
#    Annualized Volatility = sqrt(0.00045 x 365) = 0.4052776826;
#    Sharpe = 0.005/0.0212132034 x sqrt(365) = sqrt(365/18) = 4.5030853620;
#    DD = sqrt(0.01^2/2) = 0.0070710678; Downside Volatility = DD sqrt(365)
#    = sqrt(0.01825) = 0.1350925609; Sortino = 0.005 sqrt(365)/DD
#    = sqrt(365/2) = 13.5092560861.
rule: [M2, U3, M1]
