# M1, U3: continuous "Daily Returns" are labelled at the 00:00 UTC
# boundary each calendar-day return ends at, not at the mark D_t it is
# valued at.
#
# Derivation
# 1. The 5-hourly series of m1_continuous_utc_day_returns.yaml (calendar=None,
#    2024-12-01 02:00 to 12-04 00:00 UTC). D_t at the boundaries 12-02, 12-03,
#    12-04 00:00: the marks 12-01 22:00 (100), 12-02 23:00 (103), 12-04 00:00
#    (101.97).
# 2. R ending at 12-03 00:00 = 103/100 - 1 = 0.03; R ending at 12-04 00:00
#    = 101.97/103 - 1 = -0.01 (the partial first day is excluded, M2, U3).
#    Labels: the boundaries 12-03 00:00 and 12-04 00:00 UTC (12-03 00:00 is
#    not a mark of the series).
rule: [M1, U3]
kind: performance_report
inputs:
  calendar: null
  labels: ["2024-12-01T02:00:00+00:00", "2024-12-01T07:00:00+00:00", "2024-12-01T12:00:00+00:00",
           "2024-12-01T17:00:00+00:00", "2024-12-01T22:00:00+00:00", "2024-12-02T03:00:00+00:00",
           "2024-12-02T08:00:00+00:00", "2024-12-02T13:00:00+00:00", "2024-12-02T18:00:00+00:00",
           "2024-12-02T23:00:00+00:00", "2024-12-03T04:00:00+00:00", "2024-12-03T09:00:00+00:00",
           "2024-12-03T14:00:00+00:00", "2024-12-03T19:00:00+00:00", "2024-12-04T00:00:00+00:00"]
  labels_tz: UTC
  values: [98.0, 99.0, 98.0, 99.0, 100.0, 101.0, 102.0, 101.0, 102.0, 103.0,
           102.0, 101.0, 102.0, 101.0, 101.97]
  cagr_clock: calendar
expected:
  report:
    Daily Returns:
      labels: ["2024-12-03T00:00:00+00:00", "2024-12-04T00:00:00+00:00"]
      values: [0.03, -0.01]
tolerance: {abs: 1.0e-12, rel: 1.0e-9}
