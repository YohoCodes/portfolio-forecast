# M10, M1: calculate_session_returns with calendar=None gives the
# calendar-day returns between the last marks at or before each 00:00 UTC,
# the partial first day excluded.
#
# Derivation
# 1. The 5-hourly series of m1_continuous_utc_day_returns.yaml, 2024-12-01
#    02:00 to 12-04 00:00 UTC.
# 2. D_t at the boundaries 12-02, 12-03, 12-04 00:00: 12-01 22:00 (100),
#    12-02 23:00 (103), 12-04 00:00 (101.97).
# 3. R = [103/100 - 1, 101.97/103 - 1] = [0.03, -0.01]. Labels not pinned
#    (D_t's mark or the boundary: the spec fixes the values only).
rule: [M10, M1, U3]
kind: calculate_session_returns
inputs:
  calendar: null
  labels: ["2024-12-01T02:00:00+00:00", "2024-12-01T07:00:00+00:00", "2024-12-01T12:00:00+00:00",
           "2024-12-01T17:00:00+00:00", "2024-12-01T22:00:00+00:00", "2024-12-02T03:00:00+00:00",
           "2024-12-02T08:00:00+00:00", "2024-12-02T13:00:00+00:00", "2024-12-02T18:00:00+00:00",
           "2024-12-02T23:00:00+00:00", "2024-12-03T04:00:00+00:00", "2024-12-03T09:00:00+00:00",
           "2024-12-03T14:00:00+00:00", "2024-12-03T19:00:00+00:00", "2024-12-04T00:00:00+00:00"]
  labels_tz: UTC
  values: [98.0, 99.0, 98.0, 99.0, 100.0, 101.0, 102.0, 101.0, 102.0, 103.0,
           102.0, 101.0, 102.0, 101.0, 101.97]
expected:
  values: [0.03, -0.01]
tolerance: {abs: 1.0e-12, rel: 1.0e-9}
