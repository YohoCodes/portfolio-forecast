# M9 with M10: a path that hits 0 in the middle of its history. Both return
# helpers keep a NaN row for every return after ruin (0/0), so their length
# follows the input and the calendar only; the risk figures drop those rows,
# so they equal the figures of the same series with the NaN rows dropped.
#
# Derivation
# 1. Hourly marks on XNYS (EST, UTC-05:00), fill="open" layout, bars on the
#    :30 grid. 2024-11-29 is a half-day closing at 13:00: marks 09:30 (the
#    fill), 10:30, 11:30, 12:30, 13:00. 2024-12-02, 12-03 and 12-04 are full
#    sessions: an open mark at 09:30, then closes at 10:30, 11:30, 12:30,
#    13:30, 14:30, 15:30 and 16:00 (a short last bar). 5 + 3 x 8 = 29 marks.
# 2. Values: 11-29: 100, 102, 102, 102, 104. 12-02: 103, 103, 105, 105, 105,
#    106, 106, 109.2. 12-03: 110, 55, 22, 0 (ruin at 12:30), then 0 at 13:30,
#    14:30, 15:30, 16:00. 12-04: 0 at all 8 marks.
# 3. calculate_period_returns: one return per consecutive pair, 29 - 1 = 28,
#    labelled at the mark each ends at (M10):
#    11-29: 102/100 - 1 = 0.02; 0; 0; 104/102 - 1 = 2/102 = 0.0196078431372549.
#    12-02: gap 103/104 - 1 = -1/104 = -0.009615384615384616; 0;
#      105/103 - 1 = 2/103 = 0.019417475728155338; 0; 0;
#      106/105 - 1 = 1/105 = 0.009523809523809525; 0;
#      109.2/106 - 1 = 3.2/106 = 0.03018867924528302.
#    12-03: gap 110/109.2 - 1 = 0.8/109.2 = 0.007326007326007326;
#      55/110 - 1 = -0.5; 22/55 - 1 = -0.6; 0/22 - 1 = -1 (the ruin, a real
#      return); then 0/0 at 13:30, 14:30, 15:30, 16:00: NaN (M9).
#    12-04: 0/0 at all 8 marks: NaN. NaN rows: 4 + 8 = 12, the last 12.
# 4. calculate_session_returns: R_d at each full session's close (M1, M2).
#    Session 11-29 starts at the 09:30 fill, so its R_1 is partial: excluded.
#    R_2 = 109.2/104 - 1 = 0.05 (12-02 16:00).
#    R_3 = 0/109.2 - 1 = -1 (12-03 16:00): the product (1 + g) prod (1 + r)
#      over the session's returns that are not 0/0 telescopes to 0/109.2.
#    R_4 = 0/0: NaN (12-04 16:00), kept as a row. Length 3: one per full
#    session.
# 5. Risk figures use R with the NaN row dropped, [0.05, -1] (the same as the
#    path's session returns with that row dropped): mean -0.475; deviations
#    +-0.525; sample variance 2 x 0.275625 / 1 = 0.55125.
#    Annualized Volatility = sqrt(0.55125 x 252) = sqrt(138.915)
#      = 11.786220768337914.
#    Sharpe Ratio (risk-free 0) = -0.475 sqrt(252 / 0.55125)
#      = -0.475 sqrt(3200/7) = -10.155927192672127.
#    DD = sqrt((0^2 + 1^2)/2) = sqrt(0.5); Downside Volatility
#      = sqrt(0.5 x 252) = sqrt(126) = 11.224972160321824.
#    Sortino Ratio = -0.475 sqrt(252)/sqrt(0.5) = -0.475 sqrt(504)
#      = -10.663723552305733 (M7).
# 6. M9: V_T = 0, so Total Return = 0/100 - 1 = -1 and CAGR = -1; Max
#    Drawdown = 1 - 0/110 = 1 (M6).
rule: [M9, M10, M1, M2]
kind: returns_and_report
