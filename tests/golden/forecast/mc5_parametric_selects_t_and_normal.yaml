# MC5: per-class family selection by BIC (the default criterion). A large
# Student's t_3 regular pool selects t; a large normal gap pool selects the
# normal; each class independently.
#
# History (generated by the runner, test_golden.generated_history): 800 XNYS
# sessions from 2021-01-04 (to 2024-03-08), fill="open", 30-minute grid
# (every bar full, rho = 1, so l' = l under MC3). Seed 21.
#   gap      l = -0.01 + 0.01 z,      z ~ N(0, 1)         n = 799
#   regular  l = 0.0005 + 0.002 z,    z ~ Student's t_3   n = 10,376
#
# Derivation
# 1. BIC = -2 log L + k ln n with k = 2 (normal), 3 (t), 4 (Johnson SU) (MC5).
# 2. Expected winners, from the populations: the regular pool is t_3, which
#    the t family contains and the normal does not (excess kurtosis infinite);
#    the gap pool is normal, which every family contains, so the extra
#    parameters of t and Johnson SU cost ln(799) = 6.68 each and buy almost no
#    likelihood.
# 3. Check of the margin on this seed (scipy.stats fits of the three families
#    on the generated pools, done by hand outside the package, best of several
#    starting points):
#    - regular: BIC normal -88405.0, t -91756.2 (df 2.96), Johnson SU -91729.8:
#      t wins by 26.4.
#    - gap: BIC normal -5122.7, t -5116.0, Johnson SU -5109.5: normal wins by
#      6.7.
#    Caution for the implementer: scipy's t.fit with no starting df stops at
#    df = 1.92 (BIC -91536.5), where Johnson SU would win; selection needs the
#    converged maximum likelihood.
# 4. The fit (always filled for parametric) reports per class the family
#    chosen (MC5); the runner reads fit["gap"] and fit["regular"].
# 5. MC5 report, per class: Criterion "BIC"; Parameters named as scipy's
#    (normal loc, scale; t df, loc, scale); the family's BIC equals
#    -2 log L + k ln n at those parameters on the class's pool (the runner
#    recomputes it from the generated history, l' = l since rho = 1); and
#    Candidates holds normal, t and Johnson SU, lowest first, the selected
#    family's score being the lowest.
#    The fit's keys are those of parametric_monte_carlo's docstring:
#    fit[class] has "Distribution" (scipy name), "Parameters" (by name),
#    "Criterion", the criterion's score under its own name, and
#    "Candidates" (every candidate's score, lowest first).
rule: [MC5]
kind: parametric_monte_carlo
inputs:
  generate:
    kind: sessions
    calendar: XNYS
    start: "2021-01-04"
    sessions: 800
    grid: 30min
    seed: 21
    gap: {mean: -0.01, sd: 0.01}
    regular: {mean: 0.0005, sd: 0.002, df: 3}
  sim_length: 1
  n_sims: 2
  random_state: 0
expected:
  fit_none: false
  family: {gap: normal, regular: t}
  fit_report:
    gap: {criterion: BIC, candidates: [normal, t, johnsonsu]}
    regular: {criterion: BIC, candidates: [normal, t, johnsonsu]}
tolerance: 0  # names and keys; scores within 1e-6 relative of the recomputed criterion
