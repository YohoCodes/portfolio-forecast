# MC1, MC3: `classes` given explicitly (a Series, one per return) override
# inference: two returns that classify_returns would call regular and gap are
# passed as irregular, with moves (+0.05, +0.03) no future draw may repeat.
#
# History: as mc3_bootstrap_constant_hourly_half_day.yaml (XNYS, EST, hourly
#   on :30, 2024-11-25 to 11-27, fill="open"), except:
#   - the 11-25 12:30 bar has l = 0.05; `classes` calls it irregular (labels
#     alone would make it regular);
#   - the 11-26 09:30 open mark has l = 0.03 from the 11-25 close; `classes`
#     calls it irregular (labels alone would make it a gap, MC1).
#   Otherwise: full bars m = 0.002, short 15:30-16:00 bars m/2, the 11-27 gap
#   g = -0.01. Values 100 exp(sum l), 17 significant digits.
#
# Derivation
# 1. Pools (MC3, irregular excluded): gap {g} (n = 1, 11-27 only); regular
#    pool: 20 returns, 17 full at m and 3 short at m/2.
#    MC3 over regular returns only: m_hat = (17 m + 3 m/2)/(17 + 3/2) = m;
#    l' = m for all 20.
#    min_sample = 1: both classes have n >= 1.
# 2. MC1: given classes are used as given. Had the simulator inferred them
#    instead, or let either irregular return into a pool, a gap or bar draw
#    could be 0.03 or 0.05 and the 20 paths would not all be one path (each
#    would match with probability at most 1/2 per gap draw, 2^-40 for all 20
#    paths' two gaps).
# 3. Layout and path: the same as mc3_bootstrap_constant_hourly_half_day.yaml
#    (same calendar position, same forced draws): 13 future marks, path exp of
#    the cumulative 0, -0.010, -0.008, -0.006, -0.004, -0.003, -0.013, -0.011,
#    -0.009, -0.007, -0.005, -0.003, -0.001, 0.000.
# Tolerance: relative 1e-10.
rule: [MC1, MC3]
kind: nonparametric_monte_carlo
