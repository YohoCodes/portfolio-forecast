# MC2, MC8: future layout for daily history: n counts bars (a daily bar is a
# session), each labelled at its session's close, one class, never scaled.
#
# Derivation
# 1. History: our fill="open" daily output (XNYS, EST UTC-05:00): 2024-11-25
#    09:30 (fill), 11-25 16:00, 11-26 16:00, 11-27 16:00. Daily by MC1.
# 2. n = 3 bars: the next three sessions after 11-27 are 11-29 (11-28 is
#    Thanksgiving), 12-02 (after the weekend) and 12-03.
# 3. Labels at each session's close (B3): 11-29 13:00 (half-day), 12-02 16:00,
#    12-03 16:00.
# 4. Classes: daily data has one class, "regular" (U1).
# 5. tau: 1 session = 1 unit, never scaled for weekends or holidays (U2), and a
#    half-day session is still one session: tau = 1 for all three.
rule: [MC2, MC8]
kind: next_trading_dates
inputs:
  labels: ["2024-11-25T09:30:00-05:00", "2024-11-25T16:00:00-05:00",
           "2024-11-26T16:00:00-05:00", "2024-11-27T16:00:00-05:00"]
  labels_tz: America/New_York
  values: [100.0, 101.0, 102.0, 101.5]
  n: 3
expected:
  labels: ["2024-11-29T13:00:00-05:00", "2024-12-02T16:00:00-05:00", "2024-12-03T16:00:00-05:00"]
  classes: [regular, regular, regular]
  tau: [1.0, 1.0, 1.0]
tolerance: {abs: 1.0e-12}  # tau; labels and classes exact
