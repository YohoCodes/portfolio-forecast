# MC1: to_session_values on an hourly series whose every session ends at its
# close (a half-day at 13:00 included) gives no warning: no session ends
# before its close, so nothing is relabelled.
#
# Derivation
# 1. The marks and values of mc1_to_session_values_hourly (XNYS, EST
#    UTC-05:00, fill="open"): 2024-11-29 (half-day, close 13:00) 09:30 100
#    (br0), 10:30 101, 11:30 102, 12:30 101.5, 13:00 103; 2024-12-02 (close
#    16:00) 09:30 104, 10:30 105, 11:30 106, 12:30 105, 13:30 107, 14:30 108,
#    15:30 107.5, 16:00 109.
# 2. Each session's last mark is at its close (11-29 13:00, the half-day
#    close, not 16:00; 12-02 16:00), so the output is the first mark and those
#    two: 11-29 09:30 -> 100, 11-29 13:00 -> 103, 12-02 16:00 -> 109.
# 3. MC1: the short-session warning needs a session whose last mark is before
#    its close; there is none, so no UserWarning at all.
rule: [MC1]
kind: to_session_values
inputs:
  labels: ["2024-11-29T09:30:00-05:00", "2024-11-29T10:30:00-05:00", "2024-11-29T11:30:00-05:00",
           "2024-11-29T12:30:00-05:00", "2024-11-29T13:00:00-05:00",
           "2024-12-02T09:30:00-05:00", "2024-12-02T10:30:00-05:00", "2024-12-02T11:30:00-05:00",
           "2024-12-02T12:30:00-05:00", "2024-12-02T13:30:00-05:00", "2024-12-02T14:30:00-05:00",
           "2024-12-02T15:30:00-05:00", "2024-12-02T16:00:00-05:00"]
  labels_tz: America/New_York
  values: [100.0, 101.0, 102.0, 101.5, 103.0, 104.0, 105.0, 106.0, 105.0, 107.0, 108.0, 107.5, 109.0]
expected:
  labels: ["2024-11-29T09:30:00-05:00", "2024-11-29T13:00:00-05:00", "2024-12-02T16:00:00-05:00"]
  values: [100.0, 103.0, 109.0]
  warns: []
tolerance: {abs: 1.0e-12}
