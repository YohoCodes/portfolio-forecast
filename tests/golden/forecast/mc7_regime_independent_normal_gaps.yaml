# MC7: gap_model = "independent" with bootstrap = False: the HMM runs on
# regular marks only and future gaps draw from N(mu_gap, sigma_gap^2) fitted
# on all gaps, independent of the regime.
#
# History: the generated book of mc3_bootstrap_class_moments.yaml (400 XNYS
# sessions from 2023-01-03, hourly grid, seed 11): 399 gaps N(-0.01, 0.01^2);
# regular bars with mu = 0.002, sigma = 0.002 (MC7 model).
# Simulation: sim_length = 50 sessions, n_sims = 200: N_g = 10,000 gap draws.
#
# Derivation
# 1. "independent": mu_gap = mean of the 399 gaps -> -0.01, sigma_gap^2
#    (MLE) -> 1e-4. bootstrap = False: gaps ~ N(mu_gap, sigma_gap^2), so the
#    draws' mean -> -0.01 and variance -> 1e-4.
# 2. min_sample per class under "independent": 399 gaps >= 30.
# Tolerances (as mc3_bootstrap_class_moments.yaml): gap mean
# 4 sigma_g sqrt(1/399 + 1/10000) = 2.04e-3 -> 2.1e-3; gap var
# 4 sigma_g^2 sqrt(2/399 + 2/10000) = 2.89e-5 -> 2.9e-5.
rule: [MC7]
kind: regime_switching_monte_carlo
inputs:
  generate:
    kind: sessions
    calendar: XNYS
    start: "2023-01-03"
    sessions: 400
    grid: 1h
    seed: 11
    gap: {mean: -0.01, sd: 0.01}
    regular: {mean: 0.002, sd: 0.002}
  sim_length: 50
  n_sims: 200
  random_state: 16
  options: {n_regimes: 1, gap_model: independent, bootstrap: false}
expected:
  moments:
    gap: {mean: -0.01, var: 1.0e-4}
tolerance:
  gap: {mean: 2.1e-3, var: 2.9e-5}
