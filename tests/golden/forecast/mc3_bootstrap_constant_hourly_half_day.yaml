           "2024-12-02T09:30:00-05:00", "2024-12-02T10:30:00-05:00", "2024-12-02T11:30:00-05:00",
           "2024-12-02T12:30:00-05:00", "2024-12-02T13:30:00-05:00", "2024-12-02T14:30:00-05:00",
           "2024-12-02T15:30:00-05:00", "2024-12-02T16:00:00-05:00"]
  classes: [gap, regular, regular, regular, regular,
            gap, regular, regular, regular, regular, regular, regular, regular]
  fit_none: true
  path: [1.0, 0.9900498337491681, 0.9920319148370607, 0.9940179640539353, 0.9960079893439915,
         0.997004495503373, 0.9870841350202876, 0.9890602787753687, 0.9910403787728836,
         0.9930244429332351, 0.9950124791926823, 0.997004495503373, 0.999000499833375, 1.0]
  warns:
    - {match: "sim_length"}
tolerance: {abs: 1.0e-12, rel: 1.0e-10}
