# MC1: to_session_values on an hourly series where two sessions end before
# their close (missing final bars): each one's last value is labelled at that
# session's close, and one warning gives the count and the first such date.
#
# Derivation
# 1. Hourly marks (XNYS, EST UTC-05:00), fill="open"; 11-28 is Thanksgiving
#    (closed) and 11-29 a half-day closing 13:00:
#    - 2024-11-27 (normal, close 16:00): 09:30 100 (br0), 10:30 100.5,
#      11:30 101, 12:30 100.8, 13:30 101.2, 14:30 101.5, 15:30 101.3,
#      16:00 101.6. Last mark at the close.
#    - 2024-11-29 (half-day, close 13:00): 09:30 102, 10:30 102.4,
#      11:30 102.2, 12:30 102.7. The 13:00 mark (its last bar) is missing:
#      last mark 12:30, before the close.
#    - 2024-12-02 (normal, close 16:00): 09:30 103, 10:30 103.5,
#      11:30 103.2, 12:30 103.8, 13:30 104.1, 14:30 104.4. The 15:30 and
#      16:00 marks (its last two bars) are missing: last mark 14:30, before
#      the close.
#    - 2024-12-03 (normal, close 16:00): 09:30 104, 10:30 104.6,
#      11:30 104.9, 12:30 105.1, 13:30 104.8, 14:30 105.3, 15:30 105.6,
#      16:00 105.9. Last mark at the close.
# 2. MC1: keep the first mark (br0), then one value per session at its
#    close, the value of the session's last mark:
#    11-27 09:30 -> 100; 11-27 16:00 -> 101.6;
#    11-29 13:00 -> 102.7 (from 12:30, relabelled at the half-day close,
#    not at 16:00);
#    12-02 16:00 -> 104.4 (from 14:30, relabelled at the close);
#    12-03 16:00 -> 105.9.
#    Values are copied, not computed.
# 3. Warning (MC1): exactly one, one line, in the fixed wording, with k = 2
#    sessions ending before their close (11-29 and 12-02) and the first one's
#    date: "2 session(s) end before their close, first 2024-11-29: each
#    one's last value is labelled at its close".
rule: [MC1]
kind: to_session_values
inputs:
  labels: ["2024-11-27T09:30:00-05:00", "2024-11-27T10:30:00-05:00", "2024-11-27T11:30:00-05:00",
           "2024-11-27T12:30:00-05:00", "2024-11-27T13:30:00-05:00", "2024-11-27T14:30:00-05:00",
           "2024-11-27T15:30:00-05:00", "2024-11-27T16:00:00-05:00",
           "2024-11-29T09:30:00-05:00", "2024-11-29T10:30:00-05:00", "2024-11-29T11:30:00-05:00",
           "2024-11-29T12:30:00-05:00",
           "2024-12-02T09:30:00-05:00", "2024-12-02T10:30:00-05:00", "2024-12-02T11:30:00-05:00",
           "2024-12-02T12:30:00-05:00", "2024-12-02T13:30:00-05:00", "2024-12-02T14:30:00-05:00",
           "2024-12-03T09:30:00-05:00", "2024-12-03T10:30:00-05:00", "2024-12-03T11:30:00-05:00",
           "2024-12-03T12:30:00-05:00", "2024-12-03T13:30:00-05:00", "2024-12-03T14:30:00-05:00",
           "2024-12-03T15:30:00-05:00", "2024-12-03T16:00:00-05:00"]
  labels_tz: America/New_York
  values: [100.0, 100.5, 101.0, 100.8, 101.2, 101.5, 101.3, 101.6,
           102.0, 102.4, 102.2, 102.7,
           103.0, 103.5, 103.2, 103.8, 104.1, 104.4,
           104.0, 104.6, 104.9, 105.1, 104.8, 105.3, 105.6, 105.9]
expected:
  labels: ["2024-11-27T09:30:00-05:00", "2024-11-27T16:00:00-05:00", "2024-11-29T13:00:00-05:00",
           "2024-12-02T16:00:00-05:00", "2024-12-03T16:00:00-05:00"]
  tz: America/New_York
  values: [100.0, 101.6, 102.7, 104.4, 105.9]
  warns:
    - {match: '^(?-i:2 session\(s\) end before their close, first 2024-11-29: each one''s last value is labelled at its close)\Z'}
tolerance: {abs: 1.0e-12}
