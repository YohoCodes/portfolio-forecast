# MC1: midnight-labelled dates are daily.
#
# Derivation
# 1. Labels: naive dates 2024-11-25, 11-26, 11-27, 11-29 (consecutive XNYS
#    sessions; 11-28 is Thanksgiving).
# 2. MC1: "midnight-labelled dates are daily".
rule: [MC1]
kind: is_daily
inputs:
  labels: ["2024-11-25", "2024-11-26", "2024-11-27", "2024-11-29"]
  values: [100.0, 101.0, 102.0, 101.0]
expected:
  value: true
tolerance: 0  # a boolean
