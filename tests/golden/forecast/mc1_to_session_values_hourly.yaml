# MC1: to_session_values keeps the first mark (br0) and each session's
# last mark; its returns are the session returns R_d of M1.
#
# Derivation
# 1. Hourly marks (XNYS, EST UTC-05:00), fill="open":
#    - 2024-11-29 (half-day): 09:30 100 (fill), 10:30 101, 11:30 102,
#      12:30 101.5, 13:00 103
#    - 2024-12-02: 09:30 104 (open mark), 10:30 105, 11:30 106, 12:30 105,
#      13:30 107, 14:30 108, 15:30 107.5, 16:00 109
# 2. Keep the first mark, then each session's last mark (its close):
#    11-29 09:30 -> 100; 11-29 13:00 -> 103; 12-02 16:00 -> 109.
# 3. Check against M1: R_2 = (1+g_2) prod_k (1+r_{2,k}) - 1 with
#    g_2 = 104/103 - 1 and r_{2,k} the bar returns 105/104, 106/105, ...,
#    109/107.5; the product telescopes to 109/103, so R_2 = 109/103 - 1, the
#    return between the kept marks 103 and 109. R_1 = 103/100 - 1 is the partial
#    first session measured from br0.
# 4. The values are copied, not computed, so they match to rounding only.
rule: [MC1, M1]
kind: to_session_values
inputs:
  labels: ["2024-11-29T09:30:00-05:00", "2024-11-29T10:30:00-05:00", "2024-11-29T11:30:00-05:00",
           "2024-11-29T12:30:00-05:00", "2024-11-29T13:00:00-05:00",
           "2024-12-02T09:30:00-05:00", "2024-12-02T10:30:00-05:00", "2024-12-02T11:30:00-05:00",
           "2024-12-02T12:30:00-05:00", "2024-12-02T13:30:00-05:00", "2024-12-02T14:30:00-05:00",
           "2024-12-02T15:30:00-05:00", "2024-12-02T16:00:00-05:00"]
  labels_tz: America/New_York
  values: [100.0, 101.0, 102.0, 101.5, 103.0, 104.0, 105.0, 106.0, 105.0, 107.0, 108.0, 107.5, 109.0]
expected:
  labels: ["2024-11-29T09:30:00-05:00", "2024-11-29T13:00:00-05:00", "2024-12-02T16:00:00-05:00"]
  values: [100.0, 103.0, 109.0]
tolerance: {abs: 1.0e-12}
