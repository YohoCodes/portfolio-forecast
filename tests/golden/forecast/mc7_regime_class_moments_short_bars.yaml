# MC7, MC4: one regime (n_regimes = 1, gap_model = "regime",
# bootstrap = False): class-specific normal emissions, the regular one
# N(rho mu_reg, rho sigma_reg^2) on a bar of ratio rho, so future short bars
# draw with drift rho mu_reg and variance rho sigma_reg^2.
#
# History (generated by the runner from exchange_calendars and numpy, never
# the package; test_golden.generated_history): 400 XNYS sessions from
# 2023-01-03 (to 2024-08-06), fill="open", hourly grid on :30 (Delta = 1 h),
# so each session has one short last bar (15:30-16:00, or 12:30-13:00 on a
# half-day), rho = 1/2. Seed 11. Population (MC7 location-scale model):
#   gap      l = mu_g + sigma_g z,                mu_g = -0.01, sigma_g = 0.01
#   regular  l = rho mu + sqrt(rho) sigma z,      mu = 0.002, sigma = 0.002
# Counts: 399 gaps; 2791 regular returns (400 short, sum of rho = 2591).
# Classes are inferred from the labels (MC1).
#
# Simulation: sim_length = 50 sessions from the 2024-08-06 close (no half-day
# before 2024-10-15), n_sims = 200, so N_g = 200 x 50 = 10,000 gap draws,
# N_s = 10,000 short-bar draws and N_f >= 55,000 full-bar draws (six per
# full session). Draws are read back as l = ln(V_t/V_{t-1}) at each future
# mark, grouped by the result's classes and by rho = tau/Delta from its dates.
#
# Derivation
# 1. With S = 1 the chain is trivial and EM gives the class MLEs (MC7):
#    mu_gap = mean of gaps -> -0.01, sigma_gap^2 -> 1e-4;
#    mu_reg = sum l / sum rho -> 0.002 (MC7), sigma_reg^2
#    = sum (l - rho mu_reg)^2/rho / n -> 4e-6.
# 2. Future draws: gap N(mu_gap, sigma_gap^2); full bar N(mu_reg,
#    sigma_reg^2); short bar N(rho mu_reg, rho sigma_reg^2): mean 0.001,
#    var 2e-6.
# 3. min_sample (MC6): gap occupancy of the one regime is 399 >= 30.
# 4. Expected values and tolerances as mc3_bootstrap_class_moments (mu_reg
#    has standard error sigma/sqrt(sum rho), within the bound used there).
# Tolerances: 4 standard errors, history sampling plus draw sampling (z = 4
# gives a false failure below 1e-4 per check; the seed is fixed anyway).
#   gap mean:     4 sigma_g sqrt(1/399 + 1/10000) = 4 (0.01)(0.05105)
#                 = 2.04e-3 -> 2.1e-3
#   gap var:      4 sigma_g^2 sqrt(2/399 + 2/10000) = 4e-4 (0.0722)
#                 = 2.89e-5 -> 2.9e-5
#   full mean:    4 sigma sqrt(1/2791 + 1/55000) = 0.008 (0.01940)
#                 = 1.55e-4 -> 1.6e-4
#   full var:     4 sigma^2 sqrt(2/2791 + 2/55000) = 1.6e-5 (0.02744)
#                 = 4.39e-7 -> 4.4e-7
#   short mean:   rho m_hat + sqrt(rho)(mean l' - m_hat); bounding the three
#                 sources by the sum of their standard errors,
#                 rho sigma/sqrt(2591) + sqrt(rho) sigma/sqrt(2791)
#                 + sqrt(rho) sigma/sqrt(10000) = 1.96e-5 + 2.68e-5 + 1.41e-5
#                 = 6.06e-5; x 4 = 2.42e-4 -> 2.5e-4. This separates the MC7
#                 drift rho mu = 0.001 from pure sqrt(rho) scaling
#                 (sqrt(1/2) mu = 0.00141) and from no scaling (0.002).
#   short var:    4 rho sigma^2 sqrt(2/2791 + 2/10000) = 8e-6 (0.03028)
#                 = 2.42e-7 -> 2.5e-7 (no scaling would give 4e-6)
rule: [MC7, MC4]
kind: regime_switching_monte_carlo
inputs:
  generate:
    kind: sessions
    calendar: XNYS
    start: "2023-01-03"
    sessions: 400
    grid: 1h
    seed: 11
    gap: {mean: -0.01, sd: 0.01}
    regular: {mean: 0.002, sd: 0.002}
  sim_length: 50
  n_sims: 200
  random_state: 14
  options: {n_regimes: 1, gap_model: regime, bootstrap: false}
expected:
  fit_none: false
  moments:
    gap: {mean: -0.01, var: 1.0e-4}
    regular: {mean: 0.002, var: 4.0e-6}
    regular_short: {mean: 0.001, var: 2.0e-6}
tolerance:
  gap: {mean: 2.1e-3, var: 2.9e-5}
  regular: {mean: 1.6e-4, var: 4.4e-7}
  regular_short: {mean: 2.5e-4, var: 2.5e-7}
