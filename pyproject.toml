[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-forecast"
version = "0.4.0"
description = "Monte Carlo simulation of future portfolio and strategy returns"
readme = "PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "exchange_calendars",
    "python-dateutil",
]

[project.urls]
Repository = "https://github.com/YohoCodes/portfolio-forecast"
Changelog = "https://github.com/YohoCodes/portfolio-forecast/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The demo notebooks: 01 and 02 download prices from Yahoo Finance, 03 is synthetic
notebook = ["ipykernel", "yfinance"]
# hmmlearn: the reference the custom HMM EM is checked against (tests/forecast)
test = ["pytest", "pyyaml", "hmmlearn"]
lint = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["venv", "dist"]

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, import order, likely bugs
select = ["E", "W", "F", "I", "B"]
